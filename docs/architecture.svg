<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#484f58"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="960" height="460" rx="16" fill="#0d1117"/>

  <!-- column headers -->
  <text x="160" y="52" text-anchor="middle" fill="#8b949e" font-size="12" letter-spacing="2" font-weight="600">SOURCES</text>
  <text x="480" y="52" text-anchor="middle" fill="#8b949e" font-size="12" letter-spacing="2" font-weight="600">STORE</text>
  <text x="800" y="52" text-anchor="middle" fill="#8b949e" font-size="12" letter-spacing="2" font-weight="600">CONSUMERS</text>

  <!-- ===== SOURCES ===== -->
  <!-- Manual (v0.1) -->
  <g>
    <rect x="70" y="90" width="180" height="70" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="90" y="118" fill="#e6edf3" font-size="15" font-weight="600">Manual</text>
    <text x="90" y="140" fill="#8b949e" font-size="12">memory add "…"</text>
    <rect x="196" y="100" width="40" height="18" rx="9" fill="#238636"/>
    <text x="216" y="113" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">v0.1</text>
  </g>

  <!-- Git (planned) -->
  <g opacity="0.75">
    <rect x="70" y="195" width="180" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="90" y="223" fill="#e6edf3" font-size="15" font-weight="600">Git</text>
    <text x="90" y="245" fill="#8b949e" font-size="12">commit messages</text>
  </g>

  <!-- AI (planned) -->
  <g opacity="0.75">
    <rect x="70" y="300" width="180" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="90" y="328" fill="#e6edf3" font-size="15" font-weight="600">AI assistant</text>
    <text x="90" y="350" fill="#8b949e" font-size="12">session capture</text>
  </g>

  <!-- ===== STORE ===== -->
  <g>
    <rect x="360" y="90" width="240" height="280" rx="14" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>

    <!-- cylinder icon -->
    <ellipse cx="480" cy="128" rx="34" ry="10" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <path d="M 446 128 V 158 A 34 10 0 0 0 514 158 V 128" fill="#0d1117" stroke="#58a6ff" stroke-width="1.5"/>
    <path d="M 446 143 A 34 10 0 0 0 514 143" fill="none" stroke="#58a6ff" stroke-width="1.5" opacity="0.5"/>

    <text x="480" y="198" text-anchor="middle" fill="#e6edf3" font-size="17" font-weight="600">SQLite</text>
    <text x="480" y="218" text-anchor="middle" fill="#8b949e" font-size="12">one global database</text>

    <!-- tables -->
    <rect x="384" y="240" width="192" height="30" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="400" y="260" fill="#e6edf3" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">projects</text>
    <text x="560" y="260" text-anchor="end" fill="#8b949e" font-size="11">id · name · path</text>

    <rect x="384" y="278" width="192" height="30" rx="6" fill="#0d1117" stroke="#30363d"/>
    <text x="400" y="298" fill="#e6edf3" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">memories</text>
    <text x="560" y="298" text-anchor="end" fill="#8b949e" font-size="11">kind · source · content</text>

    <rect x="384" y="316" width="192" height="30" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-opacity="0.5"/>
    <text x="400" y="336" fill="#e6edf3" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">memories_fts</text>
    <text x="560" y="336" text-anchor="end" fill="#58a6ff" font-size="11">FTS5 · triggers</text>
  </g>

  <!-- ===== CONSUMERS ===== -->
  <!-- CLI (v0.1) -->
  <g>
    <rect x="710" y="90" width="180" height="70" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="730" y="118" fill="#e6edf3" font-size="15" font-weight="600">CLI</text>
    <text x="730" y="140" fill="#8b949e" font-size="12">list · search · update</text>
    <rect x="836" y="100" width="40" height="18" rx="9" fill="#238636"/>
    <text x="856" y="113" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="600">v0.1</text>
  </g>

  <!-- MCP server (planned) -->
  <g opacity="0.75">
    <rect x="710" y="195" width="180" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="730" y="223" fill="#e6edf3" font-size="15" font-weight="600">MCP server</text>
    <text x="730" y="245" fill="#8b949e" font-size="12">assistants query directly</text>
  </g>

  <!-- CLAUDE.md (planned) -->
  <g opacity="0.75">
    <rect x="710" y="300" width="180" height="70" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="730" y="328" fill="#e6edf3" font-size="15" font-weight="600">CLAUDE.md</text>
    <text x="730" y="350" fill="#8b949e" font-size="12">generated context file</text>
  </g>

  <!-- ===== ARROWS: sources → store ===== -->
  <path d="M 250 125 C 305 125, 305 150, 358 150" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 250 230 L 358 230" fill="none" stroke="#484f58" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dim)"/>
  <path d="M 250 335 C 305 335, 305 310, 358 310" fill="none" stroke="#484f58" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dim)"/>

  <!-- ===== ARROWS: store → consumers ===== -->
  <path d="M 602 150 C 655 150, 655 125, 708 125" fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 602 230 L 708 230" fill="none" stroke="#484f58" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dim)"/>
  <path d="M 602 310 C 655 310, 655 335, 708 335" fill="none" stroke="#484f58" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow-dim)"/>

  <!-- ===== LEGEND ===== -->
  <g transform="translate(70, 412)">
    <line x1="0" y1="0" x2="28" y2="0" stroke="#8b949e" stroke-width="1.5"/>
    <text x="38" y="4" fill="#8b949e" font-size="12">available in v0.1</text>
    <line x1="170" y1="0" x2="198" y2="0" stroke="#484f58" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="208" y="4" fill="#8b949e" font-size="12">planned</text>
  </g>
  <text x="890" y="416" text-anchor="end" fill="#484f58" font-size="11" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">memory · architecture</text>
</svg>
